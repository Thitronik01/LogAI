# Enable with `uv run pre-commit install`. Python tooling runs from the locked project
# environment, so its versions are defined in one place only: uv.lock.
default_install_hook_types: [pre-commit, pre-push]

# brand/ is maintained separately. No hook may check or rewrite its files.
exclude: ^brand/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^tests/(fixtures|golden)/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/(fixtures|golden)/
      - id: trailing-whitespace
        exclude: ^tests/(fixtures|golden)/

  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock is up to date
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: validate-catalog
        name: validate catalog
        entry: uv run python scripts/validate_catalog.py
        language: system
        files: ^catalog/
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-push]
