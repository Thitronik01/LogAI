name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real log data.** Logs contain personal data such as IP addresses, user names and visited hosts. Reproduce the problem with synthetic lines: `.test` host names and the documentation address ranges `192.0.2.0/24`, `198.51.100.0/24`, `203.0.113.0/24` and `2001:db8::/32`.

        Security problems do not belong here. Report them privately as described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command line and the synthetic input that trigger the problem.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `logai --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
  - type: checkboxes
    id: no-real-data
    attributes:
      label: Data
      options:
        - label: This report contains no real log data.
          required: true
